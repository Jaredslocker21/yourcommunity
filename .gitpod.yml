image: gitpod/workspace-python:latest

tasks:
  - name: Serve index.html
    init: |
      python3 -m venv .venv
      source .venv/bin/activate
      pip install -U pip
      [ -f index.html ] || echo '<h1>Hi from Gitpod</h1>' > index.html
    command: |
      # Long-running so the workspace stays up
      python3 -m http.server 8000

ports:
  - port: 8000
    onOpen: open-preview
    visibility: public
